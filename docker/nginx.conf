# Re-resolve the app container when Docker assigns a new address.
upstream homeplanner {
    zone homeplanner 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server app:9000 resolve;
}

server {
    listen 8080;
    listen [::]:8080;

    access_log /dev/stdout;
    error_log /dev/stderr;
    root /app/public;
    index index.php index.html index.htm;

    server_name _;

    charset utf-8;
    client_max_body_size 16m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location ^~ /livewire- {
        # Livewire 4 endpoints are application routes, never static files.
        rewrite ^ /index.php last;
    }

    location ~ ^/livewire/livewire(\.min)?\.js$ {
        expires off;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Proof images are served through an authenticated Laravel route.
    # This also closes direct access to legacy files kept on the public disk.
    location ^~ /storage/chores/proofs/ {
        return 404;
    }

    # Execute only Laravel's front controller, never uploaded PHP files.
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass homeplanner;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
    }

    location ~* \.php(?:/|$) {
        return 404;
    }

    # Match dotfiles before the static asset rule (including .hidden.js).
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg)$ {
        expires max;
        log_not_found off;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
