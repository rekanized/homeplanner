expose_php = Off
log_errors = On
error_log = /proc/self/fd/2
; Proof images accept up to 5 MiB; allow multipart overhead and Livewire uploads.
upload_max_filesize = 12M
post_max_size = 16M
memory_limit = 256M
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
